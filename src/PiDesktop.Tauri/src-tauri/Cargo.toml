[package]
name = "synthv-toolbox"
version = "0.1.0"
description = "Cross-platform Synthesizer V toolbox and optional AI copilot"
authors = ["SynthVCopilot"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "synthv_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4"] }
pi-agent-core = { path = "../../../external/pi-agent/crates/pi-agent-core" }
pi-agent-provider = { path = "../../../external/pi-agent/crates/pi-agent-provider" }
pi-agent-mcp = { path = "../../../external/pi-agent/crates/pi-agent-mcp" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
winreg = "0.55"
