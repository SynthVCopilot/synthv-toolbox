[package]
name = "synthv-toolbox"
version = "0.1.6"
description = "Cross-platform Synthesizer V toolbox and optional AI copilot"
authors = ["SynthVCopilot"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "synthv_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "agent-file-approval"
path = "../../../test/agent_file_approval.rs"

[[test]]
name = "credential-balancer"
path = "../../../test/credential_balancer.rs"

[[test]]
name = "provider-runtime-adapters"
path = "../../../test/provider_runtime_adapters.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
axum = "0.8"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "net"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ureq = { version = "2", features = ["json"] }
pinyin = "0.11.0"
blowfish = { version = "0.9", features = ["zeroize"] }
zeroize = "1.9"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"
