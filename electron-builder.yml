appId: com.synthvcopilot.toolbox
productName: Synthesizer V Toolbox
electronVersion: 39.2.7
directories:
  app: src/PiDesktop.Tauri
  output: release
  buildResources: src/PiDesktop.Tauri/electron/assets
files:
  - dist/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/dist
    to: components/synthv-agent-bridge/dist
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/scripts
    to: components/synthv-agent-bridge/scripts
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/synthv
    to: components/synthv-agent-bridge/synthv
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/legacy-sv1
    to: components/synthv-agent-bridge/legacy-sv1
  - from: src/PiDesktop.Tauri/components/cvrs/cvrs.py
    to: components/cvrs/cvrs.py
  - from: src/PiDesktop.Tauri/components/pi-audio
    to: components/pi-audio
  - from: src/PiDesktop.Tauri/components/vocal-separation
    to: components/vocal-separation
win:
  icon: src/PiDesktop.Tauri/electron/assets/icon.ico
  target:
    - nsis
  artifactName: "Synthesizer-V-Toolbox-${version}-setup.${ext}"
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
mac:
  icon: src/PiDesktop.Tauri/electron/assets/icon.icns
  target:
    - dmg
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "${env.CSC_NAME}"
dmg:
  license: src/PiDesktop.Tauri/electron/assets/TERMS-OF-USE.rtf
  artifactName: "Synthesizer-V-Toolbox-${version}.${ext}"
publish:
  provider: github
  channel: latest
  owner: SynthVCopilot
  repo: synthv-toolbox
  releaseType: release
