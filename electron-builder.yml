appId: com.synthvcopilot.toolbox
productName: Toneshuttle
electronVersion: 39.2.7
directories:
  app: src/PiDesktop.Tauri
  output: release
  buildResources: src/PiDesktop.Tauri/electron/assets
files:
  - dist/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/package.json
    to: components/synthv-agent-bridge/package.json
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/dist
    to: components/synthv-agent-bridge/dist
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/scripts
    to: components/synthv-agent-bridge/scripts
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/synthv
    to: components/synthv-agent-bridge/synthv
  - from: src/PiDesktop.Tauri/components/synthv-agent-bridge/legacy-sv1
    to: components/synthv-agent-bridge/legacy-sv1
  - from: src/PiDesktop.Tauri/components/cvrs/cvrs.py
    to: components/cvrs/cvrs.py
  - from: src/PiDesktop.Tauri/components/pi-audio
    to: components/pi-audio
  - from: src/PiDesktop.Tauri/components/vocal-separation
    to: components/vocal-separation
win:
  icon: src/PiDesktop.Tauri/electron/assets/icon.ico
  target:
    - nsis
  artifactName: "Toneshuttle-${version}-setup.${ext}"
  # Kept from the old product name: launch-at-login entries, kept shortcuts, taskbar pins and the installer's running-app check all name this exe path.
  executableName: "Synthesizer V Toolbox"
nsis:
  # Upgrade code electron-builder derived from the unchanged appId; pinned so installs made under the old product name upgrade in place.
  guid: 361d7bfe-b0de-50d8-b042-ed469511f1fa
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
mac:
  icon: src/PiDesktop.Tauri/electron/assets/icon.icns
  target:
    - dmg
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
dmg:
  artifactName: "Toneshuttle-${version}.${ext}"
publish:
  provider: github
  channel: latest
  owner: SynthVCopilot
  repo: synthv-toolbox
  releaseType: draft
