name: Prepare private model-auth
description: Build private Kit archives without publishing source or credentials
inputs:
  token:
    description: Read-only access to the private Platform Kit repository
    required: true
  target:
    description: Consumer package directory
    default: .
runs:
  using: composite
  steps:
    - name: Require private source access
      shell: bash
      env:
        KIT_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$KIT_TOKEN" ]; then
          echo "::error::Configure PLATFORM_KIT_TOKEN with read-only access to Platform Kit."
          exit 1
        fi
    - uses: actions/checkout@v6
      with:
        repository: lsy-404/platform-kit
        ref: model-auth-private-v0.2.7
        token: ${{ inputs.token }}
        persist-credentials: false
        path: .platform-kit-private/source
    - uses: pnpm/action-setup@v6
      with:
        version: 10.17.1
        run_install: false
    - name: Build private archives
      shell: bash
      run: |
        pnpm --dir .platform-kit-private/source/kits/model-auth install --frozen-lockfile
        pnpm --dir .platform-kit-private/source model-auth:pack
    - name: Prepare consumer
      shell: bash
      env:
        MODEL_AUTH_TARGET: ${{ inputs.target }}
      run: node .platform-kit-private/source/tooling/platform-cli/bin/platform-kit.mjs install-model-auth "$MODEL_AUTH_TARGET"
