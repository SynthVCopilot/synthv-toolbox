name: Desktop macOS Publish

on:
  workflow_run:
    workflows: [Desktop Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop Release run id
        required: true
        type: string

permissions: {}

env:
  BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
  SIGNING_URL: ${{ vars.SIGNING_URL }}

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.run_attempt == 1 && startsWith(github.event.workflow_run.path, '.github/workflows/desktop.yml') && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.run.outputs.tag }}
      version: ${{ steps.run.outputs.version }}
      source_sha: ${{ steps.run.outputs.source_sha }}
      request_id: ${{ steps.ctx.outputs.request_id }}
      input_digest: ${{ steps.ctx.outputs.input_digest }}
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - name: Checkout release tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - name: Resolve build run
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BUILD_RUN_ID: ${{ env.BUILD_RUN_ID }}
        run: node .github/scripts/publish-macos.mjs resolve
      - name: Download signing request
        uses: actions/download-artifact@v4
        with:
          name: signing-request
          path: ${{ runner.temp }}/signing-request
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Read signing request
        id: ctx
        env:
          INPUT_CONTEXT_DIR: ${{ runner.temp }}/signing-request
          INPUT_BUILD_RUN_ID: ${{ env.BUILD_RUN_ID }}
          INPUT_VERSION: ${{ steps.run.outputs.version }}
          INPUT_SOURCE_SHA: ${{ steps.run.outputs.source_sha }}
        run: node .github/scripts/publish-macos.mjs context

  await-signing:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - name: Checkout release tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - name: Wait for notarization
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_BUILD_RUN_ID: ${{ env.BUILD_RUN_ID }}
          INPUT_VERSION: ${{ needs.resolve.outputs.version }}
          INPUT_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          INPUT_REQUEST_ID: ${{ needs.resolve.outputs.request_id }}
          INPUT_INPUT_DIGEST: ${{ needs.resolve.outputs.input_digest }}
          INPUT_TIMEOUT_SECONDS: "10800"
        run: node .github/scripts/publish-macos.mjs await

  publish:
    needs: [resolve, await-signing]
    runs-on: macos-14
    timeout-minutes: 60
    concurrency:
      group: desktop-macos-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - name: Checkout release tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - name: Fetch and verify signed assets
        id: fetch
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_BUILD_RUN_ID: ${{ env.BUILD_RUN_ID }}
          INPUT_VERSION: ${{ needs.resolve.outputs.version }}
          INPUT_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          INPUT_REQUEST_ID: ${{ needs.resolve.outputs.request_id }}
          INPUT_INPUT_DIGEST: ${{ needs.resolve.outputs.input_digest }}
        run: node .github/scripts/publish-macos.mjs fetch
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SIGNED_DIR: ${{ steps.fetch.outputs.dir }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > /dev/null
          gh release upload "$RELEASE_TAG" "$SIGNED_DIR"/* --clobber
          published="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for file in "$SIGNED_DIR"/*; do
            name="$(basename "$file")"
            grep -qxF "$name" <<< "$published" || { echo "Release asset was not published: $name" >&2; exit 1; }
          done
      - name: Wipe signed workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/toolbox-signed-$GITHUB_RUN_ID" "$RUNNER_TEMP/signed-macos"
