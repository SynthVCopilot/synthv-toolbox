name: Prepare Electron Desktop Build

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
      next_patch:
        required: false
        default: false
        type: boolean
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.release && steps.release-version.outputs.version || steps.development-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            src/PiDesktop.Tauri/package-lock.json
            src/PiDesktop.Tauri/components/synthv-agent-bridge/package-lock.json
      - name: Validate release notes
        if: inputs.release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/${RELEASE_TAG}.md"
      - name: Apply version from release tag
        id: release-version
        if: inputs.release
        run: node .github/scripts/set-version.mjs "${{ github.ref_name }}"
      - name: Apply development version from source commit
        id: development-version
        if: ${{ !inputs.release }}
        run: node .github/scripts/set-dev-version.mjs "${{ github.sha }}" ${{ inputs.next_patch && '--next-patch' || '' }}
      - name: Build SynthV Bridge
        working-directory: src/PiDesktop.Tauri/components/synthv-agent-bridge
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Build Electron desktop and run Electron contracts
        working-directory: src/PiDesktop.Tauri
        run: |
          npm run build:electron
          node ../../test/electron-updater.mjs
          node ../../test/electron-ai-service.mjs
          node ../../test/electron-http-mcp-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-desktop
          if-no-files-found: error
          retention-days: 1
          path: |
            src/PiDesktop.Tauri/dist
            src/PiDesktop.Tauri/electron/dist
            src/PiDesktop.Tauri/package.json
            src/PiDesktop.Tauri/package-lock.json
            src/PiDesktop.Tauri/components/synthv-agent-bridge/dist
