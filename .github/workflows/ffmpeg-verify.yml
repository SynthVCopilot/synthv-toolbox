name: Desktop Development Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            artifact: release/*.exe
          - name: macOS
            os: macos-14
            target: --mac
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: src/PiDesktop.Tauri/package-lock.json
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Build desktop assets
        working-directory: src/PiDesktop.Tauri
        run: npm run build:electron
      - name: Run desktop contract tests
        working-directory: src/PiDesktop.Tauri
        run: npm run test:contracts
      - name: Load compiled Electron main modules
        working-directory: src/PiDesktop.Tauri
        run: npm run test:electron-main
      - name: Package development artifacts
        run: npm exec --prefix src/PiDesktop.Tauri -- electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: synthv-toolbox-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  prepare-nightly-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - name: Set nightly version
        id: nightly-version
        run: node .github/scripts/set-dev-version.mjs "${{ github.sha }}" --next-patch --sequence "${{ github.run_number }}"
      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ steps.nightly-version.outputs.version }}
          TARGET_COMMIT: ${{ github.sha }}
        run: gh release create "v$NIGHTLY_VERSION" --target "$TARGET_COMMIT" --title "Nightly $NIGHTLY_VERSION" --notes "Automated nightly desktop build." --prerelease

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-nightly-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            asset_suffix: -setup.exe
            update_metadata: nightly.yml
          - os: macos-14
            target: --mac
            asset_suffix: .dmg
            update_metadata: nightly-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: src/PiDesktop.Tauri/package-lock.json
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Set nightly version
        id: nightly-version
        run: node .github/scripts/set-dev-version.mjs "${{ github.sha }}" --next-patch --sequence "${{ github.run_number }}"
      - name: Build desktop assets
        working-directory: src/PiDesktop.Tauri
        run: npm run build:electron
      - name: Publish nightly update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm exec --prefix src/PiDesktop.Tauri -- electron-builder --config electron-builder.yml ${{ matrix.target }} --config.publish.channel=nightly --config.publish.releaseType=prerelease --publish always
      - name: Validate published nightly assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ steps.nightly-version.outputs.version }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          UPDATE_METADATA: ${{ matrix.update_metadata }}
        run: |
          $assets = @(gh release view "v$env:NIGHTLY_VERSION" --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Nightly release was not created." }
          $packageAsset = "Synthesizer-V-Toolbox-$env:NIGHTLY_VERSION$env:ASSET_SUFFIX"
          if ($assets -notcontains $packageAsset) { throw "Nightly package was not published: $packageAsset" }
          if ($assets -notcontains $env:UPDATE_METADATA) { throw "Nightly update metadata was not published: $env:UPDATE_METADATA" }
