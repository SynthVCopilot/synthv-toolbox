name: Desktop Development Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            artifact: release/*.exe
          - name: macOS
            os: macos-14
            target: --mac
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: src/PiDesktop.Tauri/package-lock.json
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Run desktop contract tests
        working-directory: src/PiDesktop.Tauri
        run: npm run test:contracts
      - name: Build desktop assets
        working-directory: src/PiDesktop.Tauri
        run: npm run build:electron
      - name: Load compiled Electron main modules
        working-directory: src/PiDesktop.Tauri
        run: npm run test:electron-main
      - name: Package development artifacts
        run: npm exec --prefix src/PiDesktop.Tauri -- electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: synthv-toolbox-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-14
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: src/PiDesktop.Tauri/package-lock.json
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Build desktop assets
        working-directory: src/PiDesktop.Tauri
        run: npm run build:electron
      - name: Publish nightly update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm exec --prefix src/PiDesktop.Tauri -- electron-builder --config electron-builder.yml ${{ matrix.target }} --config.publish.channel=nightly --config.publish.releaseType=prerelease --publish always
