name: Toolbox Dev Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolbox-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            src/PiDesktop.Tauri/package-lock.json
            src/PiDesktop.Tauri/src-tauri/components/synthv-agent-bridge/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
          components: rustfmt,clippy

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/PiDesktop.Tauri/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src/PiDesktop.Tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Check Python component sources
        run: python -m py_compile src/PiDesktop.Tauri/src-tauri/components/pi-audio/pi_audio.py src/PiDesktop.Tauri/src-tauri/components/cvrs/cvrs.py src/PiDesktop.Tauri/src-tauri/components/vocal-separation/separate.py

      - name: Build bundled SynthV Bridge
        working-directory: src/PiDesktop.Tauri/src-tauri/components/synthv-agent-bridge
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm prune --omit=dev --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund

      - name: Check frontend production build
        working-directory: src/PiDesktop.Tauri
        run: npm run build

      - name: Test desktop contracts
        working-directory: src/PiDesktop.Tauri
        run: npm run test:contracts

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src/PiDesktop.Tauri/src-tauri/Cargo.toml -- --check

      - name: Test Rust core and FFmpeg fixtures
        run: cargo test --manifest-path src/PiDesktop.Tauri/src-tauri/Cargo.toml --all-targets -- --test-threads=1

      - name: Lint Rust core
        run: cargo clippy --manifest-path src/PiDesktop.Tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Download and smoke-test fixed BtbN LGPL FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-29-13-12/ffmpeg-n8.1.2-50-g1a748fe2cd-win64-lgpl-8.1.zip
          FFMPEG_SHA256: e1cafe80e9fb3e4e4024923a2ed2544bc3a0545af09b6a7861a7193210988c63
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "synthv-toolbox-ffmpeg-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $archive = Join-Path $smokeRoot "ffmpeg.zip"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg SHA-256 mismatch: expected $env:FFMPEG_SHA256, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $smokeRoot -Force
          $ffmpeg = Get-ChildItem -Path $smokeRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $smokeRoot -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) {
            throw "The verified archive did not contain ffmpeg.exe and ffprobe.exe"
          }
          $fixture = Join-Path $smokeRoot "fixture.wav"
          & $ffmpeg.FullName -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=0.25" -c:a pcm_s24le $fixture
          if ($LASTEXITCODE -ne 0) { throw "Verified FFmpeg failed to create a PCM WAV" }
          $probe = & $ffprobe.FullName -v error -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -of json $fixture | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $probe.streams[0].codec_name -ne "pcm_s24le") {
            throw "Verified FFprobe did not report the expected 24-bit PCM stream"
          }

      - name: Smoke-test macOS system FFmpeg when available
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "The runner has no system FFmpeg; cross-platform fake-runtime tests already validated the fixture path."
            exit 0
          fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=0.25" -c:a pcm_s24le "$RUNNER_TEMP/fixture.wav"
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -of json "$RUNNER_TEMP/fixture.wav" | grep -q 'pcm_s24le'

      - name: Build desktop bundle without publishing
        working-directory: src/PiDesktop.Tauri
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify Windows NSIS output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src/PiDesktop.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundle -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS bundle was not produced" }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "synthv-toolbox-artifacts/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $artifactRoot "synthv-toolbox-dev-${{ matrix.target }}-nsis.exe")

      - name: Verify macOS universal app and DMG output
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src/PiDesktop.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          archs="$(lipo -archs "$executable")"
          test "$archs" = "x86_64 arm64" || test "$archs" = "arm64 x86_64"
          artifact_root="$RUNNER_TEMP/synthv-toolbox-artifacts/${{ matrix.target }}"
          mkdir -p "$artifact_root"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$artifact_root/synthv-toolbox-dev-${{ matrix.target }}.app.zip"
          cp "$dmg_path" "$artifact_root/synthv-toolbox-dev-${{ matrix.target }}.dmg"

      - name: Upload development build artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthv-toolbox-dev-${{ matrix.target }}
          path: ${{ runner.temp }}/synthv-toolbox-artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
