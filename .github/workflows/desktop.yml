name: Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: ./.github/workflows/prepare-desktop.yml
    with:
      release: true

  build:
    needs: prepare
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: prepared-desktop
          path: src/PiDesktop.Tauri
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            src/PiDesktop.Tauri/package-lock.json
            src/PiDesktop.Tauri/src-tauri/components/synthv-agent-bridge/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install platform dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Build desktop bundle from prepared frontend
        working-directory: src/PiDesktop.Tauri
        run: npm run tauri build -- --config ../../.github/tauri-ci.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          $installers = @(Get-ChildItem -Path "src/PiDesktop.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer." }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-assets/SynthV.Toolbox_${{ needs.prepare.outputs.version }}_x64-setup.exe"
      - name: Collect macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          installers=(src/PiDesktop.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          cp "${installers[0]}" "release-assets/SynthV.Toolbox_${{ needs.prepare.outputs.version }}_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: synthv-toolbox-${{ matrix.target }}
          if-no-files-found: error
          path: release-assets/*
          retention-days: 14

  rust_tests:
    needs: prepare
    name: Rust tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS native
            os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: prepared-desktop
          path: src/PiDesktop.Tauri
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Install platform dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Test Rust core
        run: cargo test --manifest-path src/PiDesktop.Tauri/src-tauri/Cargo.toml --all-targets -- --test-threads=1
      - name: Test precise SynthV instance controls
        run: cargo test --manifest-path test/synthv-control-regression/Cargo.toml
      - name: Lint Rust core
        run: cargo clippy --manifest-path src/PiDesktop.Tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, rust_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: synthv-toolbox-*
          path: release-assets
          merge-multiple: true
      - name: Publish release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -eq 2
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          options=(--verify-tag --title "SynthV Toolbox ${GITHUB_REF_NAME}" --notes-file "$notes")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease --latest=false); else options+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${options[@]}"
