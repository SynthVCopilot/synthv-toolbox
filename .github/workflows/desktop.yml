name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-14
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: src/PiDesktop.Tauri/package-lock.json
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Build desktop assets
        working-directory: src/PiDesktop.Tauri
        run: npm run build
      - name: Validate code-signing environment
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: |
          $missing = @("CSC_LINK", "CSC_KEY_PASSWORD", "CSC_NAME") | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) { throw "Missing code-signing environment: $($missing -join ', ')" }
      - name: Package and publish update artifacts
        working-directory: src/PiDesktop.Tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --config ../../electron-builder.yml ${{ matrix.target }} --publish always
