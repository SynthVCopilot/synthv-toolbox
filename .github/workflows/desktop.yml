name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  macos-build:
    name: macos-build
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      source_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "docs/releases/${RELEASE_TAG}.md"
          test "v$(node -p "require('./src/PiDesktop.Tauri/package.json').version")" = "$RELEASE_TAG"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: src/PiDesktop.Tauri/package-lock.json
      - name: Install desktop dependencies
        working-directory: src/PiDesktop.Tauri
        run: npm ci --no-audit --no-fund
      - name: Build desktop assets
        working-directory: src/PiDesktop.Tauri
        run: npm run build:electron
      - name: Package unsigned application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm exec --prefix src/PiDesktop.Tauri -- electron-builder --config electron-builder.yml --mac --arm64 --publish never
      - name: Build source bundle
        id: bundle
        env:
          INPUT_TAG: ${{ github.ref_name }}
          INPUT_SOURCE_SHA: ${{ github.sha }}
        run: node .github/scripts/submit-macos.mjs prepare
      - name: Hand the source bundle to the submit job
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: signing-source
          path: ${{ steps.bundle.outputs.work_dir }}/source.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # The signing key lives only in this job; it never runs dependency install or build scripts.
  macos-source:
    name: macos-source
    needs: macos-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - name: Submit source artifact to GitEdge
        id: submit
        env:
          GITEDGE_SIGNING_TOKEN: ${{ secrets.GITEDGE_SIGNING_TOKEN }}
          GITEDGE_SIGNING_PROFILE: ${{ vars.GITEDGE_SIGNING_PROFILE }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          INPUT_ARTIFACT_ID: ${{ needs.macos-build.outputs.source_artifact_id }}
          INPUT_TAG: ${{ github.ref_name }}
          INPUT_SOURCE_SHA: ${{ github.sha }}
        run: node .github/scripts/submit-macos.mjs submit
      - name: Hand the request to the publish workflow
        uses: actions/upload-artifact@v4
        with:
          name: signing-request
          path: ${{ steps.submit.outputs.context_dir }}
          if-no-files-found: error
          retention-days: 7
