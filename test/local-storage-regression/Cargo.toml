[package]
name = "local-storage-regression"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }

[[test]]
name = "local-credential-store"
path = "../local_credential_store.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
