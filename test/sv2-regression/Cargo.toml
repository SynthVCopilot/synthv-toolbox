[package]
name = "sv2-regression"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
blowfish = { version = "0.9", features = ["zeroize"] }
zeroize = "1"
ureq = { version = "2", features = ["json"] }
url = "2"

[target.'cfg(windows)'.dependencies]
junction = "2"
winreg = "0.55"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"

[lib]
path = "lib.rs"

[[test]]
name = "sandboxie_smoke"
path = "sandboxie_smoke.rs"

[[bin]]
name = "sandboxie_smoke_helper"
path = "sandboxie_smoke_helper.rs"
